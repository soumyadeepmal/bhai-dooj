<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Bhai Dooj</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<main>
<h1>Happy Bhai Dooj</h1>
<p id="hint">Tap the picture to get your tika</p>
<button id="scene" aria-label="Tap to apply the tika">
<svg id="art" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9c9"/><stop offset="1" stop-color="#ffbf80"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#fff2a8" stop-opacity=".9"/><stop offset="1" stop-color="#fff2a8" stop-opacity="0"/></radialGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#c8921a"/></linearGradient>
</defs>
<rect width="400" height="300" fill="url(#bg)"/>
<!-- string lights / marigold garland -->
<path d="M0 18 Q100 55 200 18 T400 18" stroke="#8a4b12" stroke-width="2" fill="none"/>
<g fill="#ff9d00" id="garland"></g>
<!-- floor + rug -->
<rect y="252" width="400" height="48" fill="#a85a1c"/>
<ellipse cx="200" cy="268" rx="190" ry="18" fill="#8e1b2d"/>
<ellipse cx="200" cy="268" rx="170" ry="14" fill="none" stroke="#f2c94c" stroke-width="2" stroke-dasharray="6 5"/>

<!-- BROTHER -->

 <ellipse cx="315" cy="138" rx="43" ry="48" fill="#e3ae86"/>

 <circle id="pupL" cx="298" cy="139" r="2.8" fill="#1c130f"/><circle id="pupR" cx="332" cy="139" r="2.8" fill="#1c130f"/></g>
 <path d="M313 144 Q316 152 319 150" stroke="#b97d58" stroke-width="2" fill="none" stroke-linecap="round"/>
 <path id="smile" d="M300 160 Q315 168 330 160" stroke="#8a3b2a" stroke-width="3" fill="none" stroke-linecap="round"/>
 <ellipse cx="290" cy="154" rx="7" ry="4" fill="#ee8f7c" opacity=".35"/><ellipse cx="340" cy="154" rx="7" ry="4" fill="#ee8f7c" opacity=".35"/>
 <ellipse id="tika" cx="315" cy="112" rx="0" ry="0" fill="#d1141c"/>
 <g id="rice" opacity="0" fill="#fffdf2"><ellipse cx="311" cy="108" rx="1.6" ry="1"/><ellipse cx="318" cy="107" rx="1.6" ry="1"/><ellipse cx="314" cy="104" rx="1.6" ry="1"/></g>
 <g id="sparks" opacity="0" fill="#ffd34d"><circle cx="283" cy="92" r="4"/><circle cx="347" cy="90" r="4"/><circle cx="315" cy="74" r="5"/><circle cx="270" cy="116" r="3"/><circle cx="360" cy="118" r="3"/></g>
</g>

<!-- SISTER -->
<g id="sister">

 <path d="M96 192 Q150 232 186 196 L190 206 Q150 246 92 204Z" fill="#f6a5c0"/>
 <rect x="113" y="170" width="24" height="26" rx="8" fill="#d39b72"/>

 <ellipse cx="108" cy="141" rx="4.5" ry="5" fill="#fff"/><ellipse cx="142" cy="141" rx="4.5" ry="5" fill="#fff"/>

 <!-- left arm holding the thali -->
 <path d="M80 208 Q60 232 64 252" stroke="#c2185b" stroke-width="15" fill="none" stroke-linecap="round"/>
 <circle cx="64" cy="254" r="7.5" fill="#e8b490"/>
</g>

<!-- THALI (held in her left hand) -->
<g id="thali">
 <ellipse cx="62" cy="258" rx="38" ry="9" fill="url(#gold)"/>
 <ellipse cx="62" cy="255" rx="33" ry="6.5" fill="#f6d765"/>
 <ellipse cx="62" cy="255" rx="22" ry="4" fill="none" stroke="#c8921a" stroke-width="1"/>
 <circle cx="44" cy="253" r="3.5" fill="#d1141c"/><circle cx="46" cy="251" r="2" fill="#e8c14a"/>
 <circle cx="80" cy="254" r="3" fill="#fffdf2"/><circle cx="84" cy="255" r="2.5" fill="#fffdf2"/>
 <path d="M56 252 L68 252 L65 258 L59 258Z" fill="#b5651d"/>
 <circle cx="62" cy="238" r="16" fill="url(#glow)"/>
 <path class="flame" d="M62 228 Q56 238 62 247 Q68 238 62 228Z" fill="#ff8a00"/>
 <path class="flame" d="M62 234 Q59 240 62 246 Q65 240 62 234Z" fill="#ffd34d"/>
</g>

<!-- sister's right arm (drawn by script) -->
<g id="arm">
 <line id="upper" stroke="#c2185b" stroke-width="15" stroke-linecap="round"/>
 <line id="fore" stroke="#c2185b" stroke-width="13" stroke-linecap="round"/>
 <line id="wrist" stroke="#e8b490" stroke-width="10" stroke-linecap="round"/>
 <circle id="bangle1" r="5.5" fill="none" stroke="url(#gold)" stroke-width="2.4"/>
 <circle id="hand" r="8" fill="#e8b490"/>
 <circle id="dot" r="3.6" fill="#d1141c"/>
</g>
<g id="petals"></g>
</svg>
<span id="ring"></span>
</button>
<section id="card" hidden>
<p>The tika is on, the sweets are ready, and the bond between us is celebrated today.</p>
<p>May your days be as bright as a diya, your road be full of luck, and our bond stay strong and sweet forever.</p>
<p class="big">Happy Bhai Dooj!</p>
<p class="sign">With love,<br>Soumyadeep Mal</p>
</section>
</main>
<script src="script.js"></script>
</body></html>
